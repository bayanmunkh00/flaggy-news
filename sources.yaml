# News sources. Sections and subtopics are defined in topics.yaml.
#
# Fields:
#   name              (required) unique. Renaming = a new source: its current items are marked seen silently.
#   url               RSS / Atom feed (not needed for espn / cisa_kev / nvd_critical)
#   type              rss | github_release | google_news | espn | cisa_kev | nvd_critical   (default rss)
#   subtopic          topics.yaml subtopic id. If set, every item goes there. If not set, items are
#                     classified by topics.yaml keywords (limited to `section` if given) and items that
#                     match nothing are dropped.
#   section           restrict keyword classification to this section
#   keywords          extra filter: the title or summary must contain one of these
#   title_regex       only items whose title matches this regex
#   exclude           drop items whose title matches this regex
#   skip_prereleases  true = skip canary/alpha/beta/rc/nightly releases
#   limit             take only the newest N new items per run (rest marked seen)
#   max_age_hours     ignore items older than this (default 72)
#   ai_hint           extra instruction for the AI about this source
#   block             false = do not apply the block list below to this source
#   enabled           false = switch off

# Dropped before the AI sees them (saves tokens). Publishers match the outlet name or URL host;
# keywords match whole words in the title. Case-insensitive.
block:
  publishers:
    - orcarouter
    - tech-insider
    - shattered.io
    - pillitteri
    - biggo
    - futunn
    - 富途牛牛
    - basenor
    - linkedin
    - cryptonews
    - beincrypto
    - cryptonomist
    - forklog
    - yellow.com
    - decrypt.co
    - 247wallst
    - 24/7 wall st
    - benzinga
    - tradingview
    - streetinsider
    - seekingalpha
    - seeking alpha
    - indexbox
    - globenewswire
    - prnewswire
    - pr newswire
    - forkast
    - dealroom
    - casino
    - coinpedia
  keywords:
    - price prediction
    - XRP
    - Bitcoin
    - Ethereum
    - Dogecoin
    - Chainlink
    - Solana
    - crypto
    - stock price
    - stocks to buy
    - IPO
    - casino
    - promo code
    - airdrop
    - betting tips

