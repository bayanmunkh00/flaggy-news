# flaggy-news configuration: categories, Telegram topics, sources, noise filters.

site:
  title: Flaggy News
  keep_days: 180          # delete saved articles older than this (0 = keep forever)

telegram:
  send_hours: [8, 21]     # only send between these local hours...
  utc_offset: 8           # ...in this timezone (8 = Mongolia)
  max_per_send: 10        # messages per run; the rest wait in state/outbox.json

filter:
  min_score: 3            # AI usefulness score 1-5; lower is dropped (needs an AI key)

# `thread` = Telegram forum topic id (message_thread_id) in the group.
categories:
  football: {name: Football, emoji: "⚽", thread: 4, about: "Premier League and Champions League match results with statistics."}
  hacker:   {name: Hacking,  emoji: "🕵️", thread: 5, about: "Cybersecurity: critical or exploited CVEs, breaches, bug bounty writeups, security research."}
  dota:     {name: Dota 2,   emoji: "🎮", thread: 3, about: "Dota 2: patches, tournaments, pro scene and results. Memes and fan art are low value."}
  cs2:      {name: CS2,      emoji: "🔫", thread: 3, about: "Counter-Strike 2 match results of The MongolZ and BC.Game."}
  trend:    {name: Trend,    emoji: "🔥", thread: 6, about: "Trending technology and internet stories developers talk about."}
  mongolia: {name: Mongolia, emoji: "🇲🇳", thread: 7, about: "News from Mongolia. Source text is already Mongolian."}
  ai:       {name: AI,       emoji: "🤖", thread: 8, about: "AI models, products, research and developer tools."}

# Dropped before the AI sees them (spam, SEO, crypto). Matched as substrings, case-insensitive.
block:
  publishers: [casino, "orcarouter", "coinpedia", "benzinga crypto"]
  title_keywords: ["price prediction", "casino", "promo code", "airdrop", "betting tips", "odds"]

# type: rss (default) | google_news | espn | cisa_kev | nvd_critical
# limit: take at most N new items per run from this source (rest marked seen)
# include / exclude: regex on the title.  max_age_hours: default 72.
# ai_hint: extra instruction for the AI about this source.
sources:
  # --- Football (structured results with stats from ESPN) ---
  - {name: ESPN Premier League,   type: espn, category: football, league: eng.1,          league_name: Premier League}
  - {name: ESPN Champions League, type: espn, category: football, league: uefa.champions, league_name: Champions League}

  # --- Hacking ---
  - {name: CISA KEV,             type: cisa_kev,     category: hacker}
  - {name: NVD critical CVEs,    type: nvd_critical, category: hacker}
  - {name: BleepingComputer,     category: hacker, url: "https://www.bleepingcomputer.com/feed/"}
  - {name: The Hacker News,      category: hacker, url: "https://feeds.feedburner.com/TheHackersNews"}
  - {name: Krebs on Security,    category: hacker, url: "https://krebsonsecurity.com/feed/"}
  - {name: Medium bug bounty,    category: hacker, url: "https://medium.com/feed/tag/bug-bounty", ai_hint: "Bug bounty writeup. Keep real vulnerability writeups; drop beginner listicles and ads."}
  - {name: Medium bug bounty writeup, category: hacker, url: "https://medium.com/feed/tag/bug-bounty-writeup", ai_hint: "Bug bounty writeup. Keep real vulnerability writeups; drop beginner listicles and ads."}
  - {name: InfoSec Write-ups,    category: hacker, url: "https://infosecwriteups.com/feed", ai_hint: "Security writeup. Keep real vulnerability or tooling writeups."}
  - {name: PortSwigger Research, category: hacker, url: "https://portswigger.net/research/rss", max_age_hours: 168}
  - {name: GitHub Security,      category: hacker, url: "https://github.blog/security/feed/", max_age_hours: 168}
  - {name: Project Zero,         category: hacker, url: "https://googleprojectzero.blogspot.com/feeds/posts/default", max_age_hours: 168}

  # --- Dota 2 ---
  - {name: r/DotA2, category: dota, url: "https://www.reddit.com/r/DotA2/top/.rss?t=day", limit: 3, ai_hint: "Reddit top posts. Keep patch notes, tournament news and results; drop memes."}

  # --- CS2 (headlines about results of The MongolZ and BC.Game) ---
  - name: CS2 The MongolZ
    type: google_news
    category: cs2
    url: "https://news.google.com/rss/search?q=%22The+MongolZ%22+CS2+when%3A3d&hl=en-US&gl=US&ceid=US%3Aen"
    include: "(?=.*mongolz)(?=.*(beat|defeat|win|won|wins|lose|loses|lost|advance|eliminat|upset|sweep|knock|conquer|survive|qualif|crash out|dispatch|\\d\\s?[-–:]\\s?\\d))"
    exclude: "chess|pubg|vrs|prediction|odds|betting|casino|sign|bench|coach|rank|price"
    ai_hint: "Keep only articles reporting a finished CS2 match result of The MongolZ."
  - name: CS2 BC.Game
    type: google_news
    category: cs2
    url: "https://news.google.com/rss/search?q=%22BC.Game%22+%28CS2+OR+%22Counter-Strike%22+OR+s1mple%29+when%3A3d&hl=en-US&gl=US&ceid=US%3Aen"
    include: "(?=.*(bc\\.game|s1mple))(?=.*(beat|defeat|win|won|wins|lose|loses|lost|advance|eliminat|upset|sweep|knock|conquer|survive|qualif|crash out|dispatch|\\d\\s?[-–:]\\s?\\d))"
    exclude: "chess|pubg|vrs|prediction|odds|betting|casino|sign|bench|coach|rank|price"
    ai_hint: "Keep only articles reporting a finished CS2 match result of BC.Game."

  # --- Trend ---
  - {name: Hacker News, category: trend, url: "https://news.ycombinator.com/rss", limit: 8}
  - {name: Lobsters,    category: trend, url: "https://lobste.rs/rss", limit: 5}

  # --- Mongolia ---
  - {name: ikon.mn, category: mongolia, url: "https://ikon.mn/rss", limit: 10}

  # --- AI ---
  - {name: TechCrunch AI, category: ai, url: "https://techcrunch.com/category/artificial-intelligence/feed/"}
  - {name: Hugging Face,  category: ai, url: "https://huggingface.co/blog/feed.xml"}
  - {name: OpenAI,        category: ai, url: "https://openai.com/news/rss.xml"}
